<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Подбор квартиры</title>
<style id="gate-style">
:root { color-scheme: light dark; --bg: #eef1ef; --card: #fbfcfb; --text: #17201c; --muted: #5d6b64; --line: #d5ddd8; --accent: #005fb8; --accent-ink: #ffffff; --bad: #b42318; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1412; --card: #161d1a; --text: #e8eeea; --muted: #9aa8a1; --line: #2a3530; --accent: #60cdff; --accent-ink: #00213a; --bad: #ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 14px/20px "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
#gate { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: grid; gap: 12px; }
#gate h1 { margin: 0; font: 600 20px/28px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
#gate p { margin: 0; color: var(--muted); font-size: 14px; }
#gate input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: inherit; }
#gate label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
#gate button { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 4px; background: var(--accent); color: var(--accent-ink); cursor: pointer; min-height: 44px; }
#gate button:disabled { opacity: .6; cursor: progress; }
#gate-err { color: var(--bad); font-size: 14px; }
#gate-prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
#gate-bar { height: 100%; width: 0; background: var(--accent); transition: width 160ms ease-out; }
</style>
</head>
<body>
<form id="gate" autocomplete="on" onsubmit="return false">
  <h1>Подбор квартиры</h1>
  <p id="gate-hint">Введите пароль, который вам прислали.</p>
  <input type="text" id="gate-user" value="semya" autocomplete="username" hidden>
  <input type="password" id="gate-pw" placeholder="Пароль (24 цифры)" inputmode="numeric" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <label><input type="checkbox" id="gate-remember" checked> Запомнить на этом устройстве</label>
  <div id="gate-err" role="alert" hidden></div>
  <div id="gate-prog" hidden><div id="gate-bar"></div></div>
  <button type="submit" id="gate-btn">Открыть</button>
  <noscript><p style="color:#b42318">Для сайта нужен включённый JavaScript.</p></noscript>
</form>
<script>
/* Проверка возможностей браузера — отдельно и без современного синтаксиса, чтобы сообщение показалось даже в старом браузере */
(function () {
  var ok = !!(window.crypto && window.crypto.subtle && window.TextDecoder && window.TextEncoder && window.fetch && window.Promise && window.DecompressionStream && window.MessageChannel && navigator.serviceWorker && window.isSecureContext);
  try { new Function('return async function () { await 0; }'); } catch (e) { ok = false; }
  if (!ok) {
    var e = document.getElementById('gate-err');
    e.textContent = 'Этот браузер слишком старый для сайта. Откройте ссылку в Chrome или другом современном браузере.';
    e.hidden = false;
    document.getElementById('gate-btn').disabled = true;
    window.__GATE_UNSUPPORTED__ = true;
  }
})();
</script>
<script>
(function () {
  'use strict';
  if (window.__GATE_UNSUPPORTED__) return;
  var SALT = 'Adc25WbNk/gy1tpXQLnUDA==', ITER = 600000, KEY_LS = 'podbor-key-v1';
  var pw = document.getElementById('gate-pw'), btn = document.getElementById('gate-btn');
  var err = document.getElementById('gate-err'), prog = document.getElementById('gate-prog'), bar = document.getElementById('gate-bar');
  var hint = document.getElementById('gate-hint'), remember = document.getElementById('gate-remember');
  var retryStored = null, activeSession = null;
  var siteBase = new URL('./', location.href);
  var workerURL = new URL('asset-worker.js', siteBase);
  var FONTS = '';
  if (FONTS) { var fonts = document.createElement('link'); fonts.rel = 'stylesheet'; fonts.href = FONTS; document.head.appendChild(fonts); }

  function fail(msg, retryLabel) { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = retryLabel || 'Открыть'; prog.hidden = true; }
  function fromB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function store(get, val) { try { if (get) return localStorage.getItem(KEY_LS); if (val === null) localStorage.removeItem(KEY_LS); else localStorage.setItem(KEY_LS, val); } catch (e) { return null; } return null; }
  function normalize(p) { var s = String(p).replace(/\D/g, ''); return s.length === 24 ? s.match(/.{4}/g).join('-') : null; }
  function messageForSession() { return activeSession ? { type: 'podbor-assets-init-v2', key: activeSession.key, assets: activeSession.assets } : { type: 'podbor-assets-locked-v2' }; }

  // A restarted worker asks this same controlled page to restore its volatile key.
  navigator.serviceWorker.addEventListener('message', function (event) {
    if (event.data && event.data.type === 'podbor-assets-need-key-v2' && event.ports[0]) event.ports[0].postMessage(messageForSession());
  });
  function sendSession(controller) {
    return new Promise(function (resolve, reject) {
      var channel = new MessageChannel();
      channel.port1.onmessage = function (event) { channel.port1.close(); if (event.data && event.data.ok) resolve(); else reject(new Error('worker')); };
      channel.port1.onmessageerror = function () { channel.port1.close(); reject(new Error('worker')); };
      controller.postMessage(messageForSession(), [channel.port2]);
    });
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (activeSession && navigator.serviceWorker.controller) sendSession(navigator.serviceWorker.controller).catch(function () { /* The next asset request can ask for rehydration. */ });
  });

  async function deriveRaw(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(SALT), iterations: ITER }, base, 256));
  }
  async function fetchDec(key, id, descriptor) {
    if (!/^[A-Za-z0-9_-]+$/.test(id)) throw new Error('format');
    var response;
    try { response = await fetch(new URL('e/' + id + '.bin', siteBase), { cache: 'no-cache' }); if (!response.ok) throw new Error('net'); }
    catch (_) { throw new Error('net'); }
    var encrypted;
    try { encrypted = new Uint8Array(await response.arrayBuffer()); } catch (_) { throw new Error('net'); }
    var plain;
    try { plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: encrypted.subarray(0, 12) }, key, encrypted.subarray(12))); }
    catch (_) { throw new Error('bad'); }
    if (descriptor) {
      if (!Number.isSafeInteger(descriptor.size) || descriptor.size < 0 || descriptor.size > plain.length) throw new Error('format');
      plain = plain.subarray(0, descriptor.size);
      if (descriptor.encoding === 'gzip') plain = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
      else if (descriptor.encoding !== 'identity') throw new Error('format');
    }
    return plain;
  }
  function activated(worker) {
    return new Promise(function (resolve, reject) {
      function check() { if (worker.state === 'activated') { worker.removeEventListener('statechange', check); resolve(); } else if (worker.state === 'redundant') { worker.removeEventListener('statechange', check); reject(new Error('worker')); } }
      worker.addEventListener('statechange', check); check();
    });
  }
  async function prepareWorker() {
    var registration;
    try {
      // GitHub Pages project scope: this published folder and its descendants only.
      registration = await navigator.serviceWorker.register(workerURL.href, { scope: siteBase.pathname, updateViaCache: 'none' });
      var installing = registration.installing || registration.waiting;
      if (installing) await activated(installing);
      await navigator.serviceWorker.ready;
      await new Promise(function (resolve) {
        function check() { var controller = navigator.serviceWorker.controller; if (controller && controller.scriptURL === workerURL.href) { navigator.serviceWorker.removeEventListener('controllerchange', check); resolve(); } }
        navigator.serviceWorker.addEventListener('controllerchange', check); check();
      });
      await sendSession(navigator.serviceWorker.controller);
    } catch (_) { throw new Error('worker'); }
  }
  function runScript(code) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script'), url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      script.src = url; script.onload = function () { URL.revokeObjectURL(url); resolve(); }; script.onerror = function () { URL.revokeObjectURL(url); reject(new Error('script')); };
      document.body.appendChild(script);
    });
  }
  function captureAssetLinks(assets) {
    var paths = new Set(Object.keys(assets).map(function (path) { return new URL(path, siteBase).pathname; }));
    document.addEventListener('click', async function (event) {
      var anchor = event.target.closest && event.target.closest('a[href]');
      if (!anchor || event.defaultPrevented || event.button !== 0) return;
      var url = new URL(anchor.href, location.href);
      if (url.origin !== siteBase.origin || !paths.has(url.pathname)) return;
      event.preventDefault();
      var download = anchor.hasAttribute('download');
      var target = event.ctrlKey || event.metaKey || event.shiftKey ? '_blank' : (anchor.target || '_self');
      var opened = !download && target !== '_self' ? window.open('about:blank', target) : null;
      try {
        var response = await fetch(url.href); if (!response.ok) throw new Error('net');
        var blobURL = URL.createObjectURL(await response.blob());
        if (download) {
          var link = document.createElement('a'); link.href = blobURL + url.hash; link.download = anchor.getAttribute('download') || url.pathname.split('/').pop(); link.click();
        } else if (opened) { opened.opener = null; opened.location.replace(blobURL + url.hash); }
        else if (target === '_self') location.href = blobURL + url.hash;
        else { URL.revokeObjectURL(blobURL); throw new Error('popup'); }
      } catch (_) {
        if (opened) opened.close();
        window.alert('Не удалось открыть файл. Проверьте интернет и разрешение на открытие вкладок, затем попробуйте ещё раз.');
      }
    }, true);
  }
  async function open(raw, fromStore) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var manifest = JSON.parse(new TextDecoder().decode(await fetchDec(key, 'm')));
    if (!manifest.text || !manifest.assets) throw new Error('format');
    if (!fromStore && remember.checked) store(false, toB64(raw));
    if (!fromStore && !remember.checked) store(false, null);
    activeSession = { key: key, assets: manifest.assets };
    hint.textContent = 'Пароль верный. Готовлю защищённые файлы…';
    prog.hidden = false; bar.style.width = '10%';
    await prepareWorker();
    hint.textContent = 'Загружаю каталог и карту. Фотографии откроются по мере просмотра…';
    var names = ['body', 'css', 'geo', 'catalog', 'map', 'budget', 'app'], text = {}, done = 0;
    await Promise.all(names.map(async function (name) {
      var descriptor = manifest.text[name]; if (!descriptor) throw new Error('format');
      text[name] = new TextDecoder().decode(await fetchDec(key, descriptor.id, descriptor));
      done++; bar.style.width = Math.round(10 + done / names.length * 90) + '%';
    }));
    document.title = manifest.title || 'Подбор квартиры';
    var style = document.createElement('style'); style.textContent = text.css; document.head.appendChild(style);
    var gateStyle = document.getElementById('gate-style'); if (gateStyle) gateStyle.remove();
    document.body.innerHTML = text.body;
    captureAssetLinks(manifest.assets);
    for (var i = 2; i < names.length; i++) await runScript(text[names[i]]);
    var about = document.getElementById('view-about');
    if (about) {
      var box = document.createElement('div'); box.className = 'section';
      box.innerHTML = '<h2>Пароль на этом устройстве</h2><p class="small">Если сайт запомнил пароль, а устройство чужое, нажмите кнопку.</p>';
      var button = document.createElement('button'); button.type = 'button'; button.className = 'btn'; button.textContent = 'Забыть пароль на этом устройстве';
      button.addEventListener('click', function () {
        store(false, null); activeSession = null;
        if (navigator.serviceWorker.controller) { var channel = new MessageChannel(); navigator.serviceWorker.controller.postMessage({ type: 'podbor-assets-clear-v2' }, [channel.port2]); }
        location.reload();
      });
      box.appendChild(button); about.appendChild(box);
    }
  }
  async function attempt(raw, fromStore) {
    btn.disabled = true; err.hidden = true; retryStored = null;
    try { await open(raw, fromStore); }
    catch (error) {
      activeSession = null;
      var message = error && error.message;
      if (message === 'bad') {
        if (fromStore) { store(false, null); hint.textContent = 'Введите пароль, который вам прислали.'; fail('Пароль сменился, введите новый.'); pw.focus(); }
        else fail('Пароль не подошёл. Проверьте и попробуйте ещё раз.');
      } else if (message === 'net') {
        if (fromStore) retryStored = raw;
        fail('Не удалось загрузить сайт: проверьте интернет и нажмите «Повторить».', 'Повторить');
      } else if (message === 'worker') fail('Браузер не разрешил открыть защищённые файлы. Откройте сайт по HTTPS в современном браузере и обновите страницу.');
      else fail('Что-то пошло не так при открытии сайта. Обновите страницу.');
    }
  }
  document.getElementById('gate').addEventListener('submit', async function (event) {
    event.preventDefault();
    if (retryStored) { var stored = retryStored; btn.textContent = 'Открываю…'; await attempt(stored, true); return; }
    var password = normalize(pw.value);
    if (!password) { fail('В пароле должно быть 24 цифры, дефисы можно не ставить.'); return; }
    btn.disabled = true; btn.textContent = 'Проверяю пароль…'; err.hidden = true;
    var raw;
    try { raw = await deriveRaw(password); } catch (_) { fail('Не получилось проверить пароль в этом браузере.'); return; }
    await attempt(raw, false);
  });
  var saved = store(true);
  if (saved) {
    try { hint.textContent = 'Открываю сайт…'; btn.textContent = 'Открываю…'; attempt(fromB64(saved), true); }
    catch (_) { store(false, null); fail('Не получилось прочитать сохранённый пароль. Введите его снова.'); pw.focus(); }
  } else pw.focus();
})();
</script>
</body>
</html>
